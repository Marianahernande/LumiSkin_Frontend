<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil — Dahlia Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__logo">D</div>
        <span class="sidebar__brand-name">Dahlia · Admin</span>
      </div>
      <nav class="sidebar__nav">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reservas.html" class="nav-link">Gestionar reservas</a>
        <a href="servicios.html" class="nav-link">Servicios</a>
        <a href="auditoria.html" class="nav-link">Auditoría</a>
        <a href="perfil.html" class="nav-link nav-link--active">
          <span class="nav-link__dot"></span> Mi perfil
        </a>
      </nav>
      <div class="sidebar__footer">
        <a href="#" class="sidebar__logout">Cerrar sesión</a>
      </div>
    </aside>

    <main class="main">
      <header class="page-header">
        <h1 class="page-title">Mi perfil</h1>
      </header>

      <form class="form-card">
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" class="form-control" value="">
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" class="form-control" value="">
        </div>
        <div class="form-group">
          <label for="rol">Rol</label>
          <input type="text" id="rol" class="form-control" value="Administrador" readonly>
        </div>
        <button type="submit" class="btn btn--primary">Guardar cambios</button>
      </form>

      <section class="btn-guide">
        <p class="btn-guide__title">Estados de botón — guía de componentes</p>
        <div class="btn-states">
          <div class="btn-state">
            <button type="button" class="btn btn--primary">Reposo</button>
            <p class="btn-state__label">Reposo</p>
          </div>
          <div class="btn-state">
            <button type="button" class="btn btn--primary btn--hover-sim">Hover</button>
            <p class="btn-state__label">Hover (simulado)</p>
          </div>
          <div class="btn-state">
            <button type="button" class="btn btn--primary btn--loading" disabled>
              <svg class="spinner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
              Cargando
            </button>
            <p class="btn-state__label">Cargando</p>
          </div>
          <div class="btn-state">
            <button type="button" class="btn btn--disabled-look" disabled>Deshabilitado</button>
            <p class="btn-state__label">Deshabilitado</p>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
